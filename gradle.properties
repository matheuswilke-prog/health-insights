# JVM — aumentado de 2 GB para 4 GB para suportar 14 módulos
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Paralelismo — habilita sync/build de múltiplos módulos em paralelo
org.gradle.parallel=true

# Build cache — reutiliza outputs de builds anteriores
org.gradle.caching=true

# Configuration cache — evita reprocessar build scripts sem mudança
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# Android
android.disallowKotlinSourceSets=false
