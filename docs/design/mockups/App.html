<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Health Insights — App completo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="tokens.css"/>
<style>
  html, body { background: #E8E8E3; height: 100%; }
  .frame-wrap { display: flex; align-items: flex-start; justify-content: center; padding: 24px 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="android-frame.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app-screens.jsx"></script>

<script type="text/babel">
function Phone({ children }) {
  return (
    <div className="frame-wrap">
      <AndroidDevice width={412} height={892}>
        <div style={{ height: '100%' }}>{children}</div>
      </AndroidDevice>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas
      title="Health Insights — Onboarding completo + Dashboard + Settings"
      subtitle="Variante A · Apple Health minimal · todos os estados especificados">

      <DCSection id="onb" title="Onboarding (T1 → T6)">
        <DCArtboard id="welcome" label="T1 · Welcome (já aprovado)" width={460} height={952}>
          <Phone><WelcomeA onContinue={()=>{}}/></Phone>
        </DCArtboard>
        <DCArtboard id="profile" label="T2 · Profile" width={460} height={952}>
          <Phone><ProfileScreen/></Phone>
        </DCArtboard>
        <DCArtboard id="goal" label="T3 · Goal · preview reativo" width={460} height={952}>
          <Phone><GoalScreen/></Phone>
        </DCArtboard>
        <DCArtboard id="consent" label="T4 · Consent (ConnectA)" width={460} height={952}>
          <Phone><ConnectA onContinue={()=>{}}/></Phone>
        </DCArtboard>
      </DCSection>

      <DCSection id="connecting" title="T5 · Connecting — 3 estados">
        <DCArtboard id="conn-loading" label="Loading" width={460} height={952}>
          <Phone><ConnectingScreen state="loading"/></Phone>
        </DCArtboard>
        <DCArtboard id="conn-not-installed" label="Health Connect não instalado" width={460} height={952}>
          <Phone><ConnectingScreen state="not-installed"/></Phone>
        </DCArtboard>
        <DCArtboard id="conn-partial" label="Sucesso parcial" width={460} height={952}>
          <Phone><ConnectingScreen state="partial"/></Phone>
        </DCArtboard>
      </DCSection>

      <DCSection id="dashboard" title="T6 · Dashboard Hoje — 4 estados">
        <DCArtboard id="dash-content" label="Content (déficit hoje)" width={460} height={952}>
          <Phone><DashboardScreen state="content"/></Phone>
        </DCArtboard>
        <DCArtboard id="dash-empty" label="Empty (sem ingestão)" width={460} height={952}>
          <Phone><DashboardScreen state="empty"/></Phone>
        </DCArtboard>
        <DCArtboard id="dash-loading" label="Loading (skeleton)" width={460} height={952}>
          <Phone><DashboardScreen state="loading"/></Phone>
        </DCArtboard>
        <DCArtboard id="dash-error" label="Error · permissão revogada" width={460} height={952}>
          <Phone><DashboardScreen state="error"/></Phone>
        </DCArtboard>
      </DCSection>

      <DCSection id="settings" title="Settings — LGPD Art. 18 + manutenção">
        <DCArtboard id="settings-main" label="Settings · lista" width={460} height={952}>
          <Phone><SettingsScreen/></Phone>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
